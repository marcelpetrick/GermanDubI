name: Dependency audit

# Pinning is not maintenance. Every version in this repository is exact, which makes builds
# reproducible and does nothing whatsoever about a vulnerability disclosed after the pin was
# written. This is the part that notices.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A disclosure does not wait for the next commit.
    - cron: "23 5 * * *"

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      # The resolved lockfile, not the installed environment: this project's own package is
      # installed editable and is not on PyPI, which pip-audit reports as an error it cannot
      # skip. Audit the exact exported pins directly so pip does not resolve dependencies
      # again or download the provider stacks to read their metadata.
      - name: Export the resolved dependencies
        run: |
          uv export --locked --format requirements-txt --no-emit-project --no-dev \
            --quiet --output-file default.txt
          uv export --locked --format requirements-txt --no-emit-project --no-dev --all-extras \
            --quiet --output-file extras.txt

      # What every user gets, and what the wheel declares. Blocking.
      - name: Audit the default install
        run: >-
          uv run --with pip-audit pip-audit --strict --disable-pip --require-hashes
          --progress-spinner off -r default.txt

      # The optional provider stacks still have accepted advisories documented in the
      # project plan. Report them while their upstream and CUDA constraints are in place.
      - name: Audit the provider extras
        continue-on-error: true
        run: >-
          uv run --with pip-audit pip-audit --disable-pip --require-hashes
          --progress-spinner off -r extras.txt

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install
        run: |
          cd frontend && pnpm install --frozen-lockfile
          cd ../e2e && pnpm install --frozen-lockfile

      # Almost everything this finds is transitive, and an exact pin in package.json does
      # not move a transitive dependency: the lockfile holds it where it was resolved. The
      # first fix to try is regenerating the lockfile, which takes every patched release
      # the declared ranges allow. A pnpm override in the project's pnpm-workspace.yaml is
      # the fallback for an advisory no range admits a fix for, with a comment naming it
      # and saying when to drop it. The minimatch override for GHSA-g3hv-75wg-m249 went
      # once all parents resolved versions outside the affected range.
      - name: Audit frontend dependencies
        run: cd frontend && pnpm audit --audit-level=high

      - name: Audit end-to-end dependencies
        run: cd e2e && pnpm audit --audit-level=high
