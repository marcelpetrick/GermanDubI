name: Real providers

# Every gate in this repository runs against deterministic fakes, which is right for a
# pull request and proves nothing about the models. This is the counterpart: it installs
# the real provider stacks and exercises them.
#
# It is scheduled rather than triggered by a push, and it does not gate anything. What it
# catches is upstream breakage -- a model host changing, a source site changing, a new
# release of a provider regressing -- which arrives on its own schedule rather than ours,
# and which a contributor cannot have caused.
on:
  schedule:
    # Weekly. More often costs model downloads for a class of failure that is not sudden.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: providers
  cancel-in-progress: false

jobs:
  real-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # espeak-ng speaks the offline narration fixture the first dub uses.
      - name: Install FFmpeg and espeak-ng
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg espeak-ng

      # yt-dlp cannot get formats from YouTube without solving a JavaScript challenge, and
      # needs a runtime to do it. Without this the failure reads "This video is not
      # available", which points nowhere near the cause.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install every real provider
        run: make install-providers

      - name: Report the environment
        run: uv run germandubi doctor

      - name: Run the real-provider tests
        run: make test-real

      # The two dubs below answer different questions, so each can fail on its own.
      #
      # YouTube's bot check refuses anonymous downloads from GitHub's runner addresses
      # ("Sign in to confirm you're not a bot"); every scheduled run from 2026-09-07 to
      # 2026-10-05 died on it before a single model ran. A source no site can refuse keeps
      # the real providers under test regardless.
      - name: Dub generated English narration end to end
        # Bounded to an excerpt: this is a check that the pipeline still produces German
        # from real English speech, not a benchmark. Timings from a shared runner mean
        # nothing.
        run: >-
          ./scripts/benchmark_real_dub.py --spoken-fixture --excerpt-seconds 60
          --output "$RUNNER_TEMP/measurements/real-dub-fixture.json"
          --export-to "$RUNNER_TEMP/dub-fixture"

      - name: Dub the reference YouTube source end to end
        if: ${{ !cancelled() }}
        # Exit status 3 means YouTube refused this runner's address. That is a verdict on
        # the network, not on the code, so it does not fail the job -- but the script
        # annotates the run with a warning and this step says so in the summary, so a week
        # without a download check is visible, never silent. Any other failure fails.
        run: |
          set +e
          ./scripts/benchmark_real_dub.py --excerpt-seconds 60 \
            --output "$RUNNER_TEMP/measurements/real-dub-youtube.json" \
            --export-to "$RUNNER_TEMP/dub-youtube"
          status=$?
          if [ "$status" -eq 3 ]; then
            {
              echo "### YouTube download not verified"
              echo
              echo "YouTube refused this runner's address with its bot check, so this run"
              echo "could not test downloading from it. The offline narration dub above"
              echo "still covers the providers. See Q-E6 in docs/project/questions.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

      # Only what this run measured. Writing to the committed docs/benchmarks/real-dub.json
      # meant a failed run uploaded a weeks-old local measurement as if it were its own.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: real-provider-measurement
          path: ${{ runner.temp }}/measurements/
          if-no-files-found: warn
          retention-days: 30
