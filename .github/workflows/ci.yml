name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. Nothing in this workflow writes to the repository.
permissions:
  contents: read

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from tags, which a shallow clone lacks.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # No `cache: pnpm` here. This repository has no pnpm project at its root -- the two
      # are in frontend/ and e2e/ -- so setup-node's post-job cache step resolves a store
      # path that never gets created and fails the whole job with a Path Validation Error,
      # after the gate has already passed. Caching a few seconds of install is not worth a
      # job that reports failure on a successful run.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      # The single source of truth for what "green" means. CI deliberately does not repeat
      # the individual steps here: if this file listed them, it could drift from what a
      # developer runs, and the drift would only surface as a CI-only failure.
      - name: Run the pipeline
        run: ./localPipeline.sh

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  # The pipeline never builds the container image, so a Dockerfile that no longer matches
  # the repository -- a manifest the frontend install now needs, a base image tag that does
  # not exist -- was only found at tag time, by the workflow that publishes. This builds the
  # lean image, which runs every stage of the Dockerfile in a few minutes, and starts it
  # once. It does not catch what only the provider stacks hit, such as a dependency that has
  # no wheel for arm64; the full multi-architecture build stays in image.yml.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build the lean image
        run: docker build --build-arg PROVIDERS=lean --build-arg VERSION=0.0.0-dev --tag germandubi:ci .

      - name: Start the image
        run: docker run --rm germandubi:ci version
