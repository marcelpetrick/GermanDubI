name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. Nothing in this workflow writes to the repository.
permissions:
  contents: read

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # setuptools-scm derives the version from tags, which a shallow clone lacks.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      # The single source of truth for what "green" means. CI deliberately does not repeat
      # the individual steps here: if this file listed them, it could drift from what a
      # developer runs, and the drift would only surface as a CI-only failure.
      - name: Run the pipeline
        run: ./localPipeline.sh

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
