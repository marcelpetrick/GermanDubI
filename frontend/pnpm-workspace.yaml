# pnpm 12 no longer reads the "pnpm" field in package.json; its settings live here now.
# The install warns about what it ignored, but an ignored setting still installs, so every
# setting here has to be checked rather than assumed. Security overrides belong here too,
# under "overrides:", each with the advisory it covers and when it can go.

# The one dependency allowed to run an install script, carried over unchanged. It is
# currently inert: vite 8 bundles with rolldown and lists esbuild only as an optional peer,
# so nothing in the tree installs it. Kept as the standing answer for the day something
# pulls it back in, rather than as a setting that does anything today.
onlyBuiltDependencies:
  - esbuild
