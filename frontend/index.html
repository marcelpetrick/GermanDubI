<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>GermanDubI</title>
    <meta
      name="description"
      content="Turn an English video into an editable, synchronized German dub."
    />
  </head>
  <body>
    <script>
      // Resolve the theme before first paint. Without this a dark-mode reader gets a
      // white flash on every load, because React has not mounted yet.
      (function () {
        try {
          var stored = window.localStorage.getItem('germandubi.theme');
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark =
            preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
